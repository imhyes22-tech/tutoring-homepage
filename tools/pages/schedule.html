  <section class="block" id="schedule">
    <div class="wrap">
      <form class="finder-search sch-search" id="schForm">
        <input type="search" id="schQ" placeholder="🏫 학교 이름 (예: 사직고, 대치중, 가재울초)" aria-label="학교 이름" required>
        <button class="btn yellow" type="submit">찾기</button>
      </form>
      <p class="sch-msg" id="schMsg">학교 이름을 넣고 찾기를 눌러 주세요.</p>
      <div class="sch-schools" id="schSchools"></div>

      <div id="schResult" hidden>
        <h2 class="sch-title" id="schTitle"></h2>
        <div class="region-chips" id="schGrades"></div>
        <div class="sch-legend">
          <span class="ev-exam">📝 시험</span><span class="ev-break">🏖️ 방학 · 개학</span><span class="ev-off">😴 휴업일</span><span class="ev-etc">📌 행사</span>
        </div>
        <div class="sch-list" id="schList"></div>
        <div class="highlight sch-cta">
          <p class="hl-main" style="font-size:clamp(20px,3vw,28px)">시험이 다가오고 있나요?<br><mark>시험 4주 전</mark>부터 계획을 세우면 달라져요.</p>
          <p class="hl-sub">우리 학교 시험 범위에 맞춘 학습 계획, 상담에서 함께 세워요.</p>
          <a href="/contact.html" class="btn yellow" style="margin-top:18px" id="schCta">시험 대비 상담 신청 ✏️</a>
        </div>
      </div>
      <p class="note">* 학사일정은 나이스 교육정보 개방 포털(open.neis.go.kr)의 공공데이터로, 학교가 등록한 일정을 그대로 보여드려요.<br>* 학교 사정에 따라 바뀔 수 있으니 정확한 일정은 학교 공지를 확인해 주세요.</p>
    </div>
  </section>

  <script src="/schedule.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const esc = Schedule.esc;

      $('schForm').addEventListener('submit', async e => {
        e.preventDefault();
        const name = $('schQ').value.trim();
        if (!name) return;
        $('schResult').hidden = true;
        $('schSchools').innerHTML = '';
        $('schMsg').textContent = '학교를 찾고 있어요…';
        try {
          const rows = await Schedule.neis('schoolInfo', { SCHUL_NM: name });
          if (!rows.length) { $('schMsg').textContent = '찾는 학교가 없어요. 학교 이름을 다시 확인해 주세요. (예: 사직고 → 사직고등학교)'; return; }
          $('schMsg').textContent = rows.length === 1 ? '' : '학교를 골라 주세요.';
          $('schSchools').innerHTML = rows.map((r, i) => `
            <button class="card sch-school" data-i="${i}">
              <b>${esc(r.SCHUL_NM)}</b><span>${esc(r.LCTN_SC_NM)} · ${esc(r.ORG_RDNMA)}</span>
            </button>`).join('');
          $('schSchools').onclick = ev => {
            const b = ev.target.closest('.sch-school'); if (!b) return;
            pick(rows[b.dataset.i]);
          };
          if (rows.length === 1) pick(rows[0]);
        } catch {
          $('schMsg').textContent = '학사일정을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
        }
      });

      async function pick(s) {
        $('schSchools').innerHTML = '';
        $('schMsg').textContent = `${s.SCHUL_NM} 학사일정을 불러오는 중…`;
        try {
          await Schedule.show(s, { grades: $('schGrades'), list: $('schList') });
          $('schMsg').textContent = '';
          $('schTitle').innerHTML = `🏫 ${esc(s.SCHUL_NM)} <small>앞으로 6개월 일정</small>`;
          $('schCta').href = '/contact.html?school=' + encodeURIComponent(s.SCHUL_NM) + '#apply';
          $('schResult').hidden = false;
          $('schResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch {
          $('schMsg').textContent = '학사일정을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
        }
      }
    })();
  </script>
